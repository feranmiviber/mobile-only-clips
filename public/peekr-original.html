*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#080808;--surface:#0f0f0f;--card:#141414;--border:#1e1e1e;
  --text:#f0ece4;--muted:#555;--soft:#888;
  --accent:#c8a96e;--ad:#c8a96e18;--am:#c8a96e44;
  --green:#5ce09a;--red:#e05c5c;
}
html,body{height:100%;overflow:hidden;width:100%;max-width:100%;}
body{background:#050505;font-family:'DM Mono',monospace;font-weight:300;color:var(--text);display:flex;align-items:center;justify-content:center;}

/* PHONE */
.phone{width:390px;height:844px;background:var(--bg);border-radius:44px;border:1px solid #222;overflow:hidden;position:relative;box-shadow:0 0 0 1px #111,0 60px 120px rgba(0,0,0,.9);flex-shrink:0;}
@media(max-width:480px){

  .phone{width:100vw;height:100dvh;border-radius:0;border:none;box-shadow:none;}
}


/* BOTTOM DOCK */
.dock{position:absolute;bottom:0;left:0;right:0;height:72px;background:rgba(8,8,8,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 4px 12px;z-index:30;}
.dock-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 14px;opacity:.35;transition:opacity .2s;}
.dock-btn.on{opacity:1;}
.dock-btn svg{width:24px;height:24px;stroke:var(--text);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.dock-btn.on svg{stroke:var(--accent);}
.dock-btn span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--text);}
.dock-btn.on span{color:var(--accent);}

/* SCREENS */
.scr{position:absolute;top:0;left:0;right:0;bottom:72px;overflow-y:auto;overflow-x:hidden;display:none;}
.scr.on{display:block;animation:su .35s cubic-bezier(.16,1,.3,1) both;}
.scr::-webkit-scrollbar{display:none;}
.scr.full{top:0;bottom:0;}

@keyframes su{from{opacity:0;transform:translateY(50px)}to{opacity:1;transform:translateY(0)}}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.05)}}
@keyframes spring{0%{transform:scale(1)}20%{transform:scale(.88)}50%{transform:scale(1.08)}75%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8px,-6px) scale(1.04)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-6px,8px) scale(1.06)}}
.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s ease,transform .6s ease;}.reveal.vis{opacity:1;transform:translateY(0);}
.reveal-pill{opacity:0;transform:scale(.85);transition:opacity .4s ease,transform .4s ease;}.reveal-pill.vis{opacity:1;transform:scale(1);}
.shimmer-line{background:linear-gradient(90deg,transparent 0%,var(--accent) 30%,rgba(255,255,255,.3) 50%,var(--accent) 70%,transparent 100%)!important;background-size:200% 100%;animation:shimmer 4s ease-in-out infinite;}
.lp-reveal{opacity:1;transform:translateY(0);}
.lp-step{opacity:1;transform:translateY(0) scale(1);}

.serif{font-family:'Cormorant Garamond',serif;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;}
.grain::after{content:'';position:absolute;inset:0;border-radius:inherit;opacity:.035;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:128px 128px;mix-blend-mode:overlay;}
.lbl{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:8px;}
.inp{width:100%;background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'DM Mono',monospace;font-weight:300;font-size:13px;padding:12px 14px;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--am);}
.inp::placeholder{color:var(--muted);}
textarea.inp{resize:vertical;min-height:68px;}
.btn{width:100%;background:var(--accent);border:none;border-radius:14px;padding:18px;cursor:pointer;font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--bg);display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .2s;}
.btn:hover{opacity:.88;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.pill{background:none;border:1px solid var(--border);border-radius:20px;padding:6px 16px;cursor:pointer;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transition:all .2s;}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--bg);}
.spin{width:16px;height:16px;border:2px solid rgba(8,8,8,.25);border-top-color:var(--bg);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;}

/* TOAST */
.toast{position:absolute;bottom:96px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--card);border:1px solid var(--border);padding:10px 18px;font-size:12px;color:var(--text);letter-spacing:.06em;opacity:0;transition:all .3s;z-index:999;white-space:nowrap;pointer-events:none;border-radius:8px;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* SHEET */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:flex-end;backdrop-filter:blur(4px);overflow:hidden;}
.sheet.on{display:flex;}
.sheet-body{width:100%;background:var(--surface);border-top:1px solid var(--border);padding:28px 22px 44px;}
.sheet-body::before{content:'';display:block;width:36px;height:3px;background:var(--border);margin:0 auto 24px;border-radius:2px;}

/* TAB SWITCHER */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-radius:12px;overflow:hidden;}
.tab{padding:12px;text-align:center;cursor:pointer;font-size:12px;letter-spacing:.12em;text-transform:uppercase;transition:all .2s;}

/* TOGGLE */
.tog{width:44px;height:24px;border-radius:12px;position:relative;flex-shrink:0;cursor:pointer;transition:background .25s;}
.tog .knob{position:absolute;top:3px;width:18px;height:18px;border-radius:9px;background:var(--bg);transition:all .25s;}
</style>

const PAYOUT_MIN=25;
function poMoney(n){return '$'+(Number(n)||0).toFixed(2);}

  wrap.style.display='block';
  wrap.style.opacity=ready?'':'.45';

  if(!ready)amt.value='';
}
async function loadPayouts(){
  if(!user)return;
  const hist=document.getElementById('po-history');
  const hint=document.getElementById('po-hint');
  document.getElementById('po-min').textContent=PAYOUT_MIN;

  // No NOWPayments address means nothing can be sent — point at the existing connect flow.
  if(!(creator?.payout_method==='paypal'&&creator?.paypal_email)){
    document.getElementById('po-available').textContent='$0.00';
    document.getElementById('po-dest').textContent='your NOWPayments';
    poSetRequestEnabled(false);
    hint.innerHTML='Connect a NOWPayments email to start receiving payouts. <span style="color:var(--accent);cursor:pointer;text-decoration:underline;" onclick="openPayoutEdit()">Connect &#8594;</span>';
    hist.innerHTML='';
    return;
  }

  const fetchPayouts=()=>
Promise.all([
    sb.from('creator_balance').select('available,lifetime_earned,pending_payouts').eq('creator_id',user.id).single(),
    sb.from('payout_requests').select('*').eq('creator_id',user.id).order('requested_at',{ascending:false})
  ]);
  let[balRes,reqRes]=await fetchPayouts();
  if((balRes.error||reqRes.error)&&isAuthErr(balRes.error||reqRes.error)&&await ensureSession())[balRes,reqRes]=await fetchPayouts();
  const err=balRes.error||reqRes.error;
  if(err){
    console.warn('loadPayouts failed',err);
    hint.textContent="Couldn't load your balance.";
    toast("Couldn't load payouts ("+String(err.code||err.message||'unknown').slice(0,60)+')');
    return;
  }

  const bal=balRes.data||{};
  const avail=Number(bal.available)||0;
  document.getElementById('po-available').textContent=poMoney(avail);
  document.getElementById('po-lifetime').textContent=poMoney(bal.lifetime_earned);
  document.getElementById('po-pending').textContent=poMoney(bal.pending_payouts);
  document.getElementById('po-dest').textContent=creator.paypal_email;

  const ready=avail
=PAYOUT_MIN;
  poSetRequestEnabled(ready);
  if(!ready){
    hint.textContent=poMoney(PAYOUT_MIN-avail)+' to go until you can request a payout.';
  }else{
    hint.textContent='Ready to withdraw.';
    const amt=document.getElementById('po-amount');
    amt.min=PAYOUT_MIN;
    amt.max=avail.toFixed(2);

  const rows=reqRes.data||[];

      +'<div style="min-width:0;"><div class="serif" style="font-size:20px;font-weight:300;">'+poMoney(r.amount)+'</div>'
      +'<div style="font-size:11px;color:var(--muted);margin-top:3px;">'+new Date(r.requested_at).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})+'</div>'
      +'<div style="font-size:10px;color:var(--muted);opacity:.7;margin-top:2px;word-break:break-all;">'+esc(r.payout_email||'')+'</div></div>'
      +'<div style="font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:'+col+';border:1px solid '+col+';border-radius:20px;padding:5px 10px;white-space:nowrap;">'+label+'</div></div>';
  }).join(''):'<div style="border:1px dashed var(--border);border-radius:14px;padding:28px;text-align:center;font-size:12px;color:var(--muted);line-height:1.7;">No payouts yet.<br>Your first request will show up here.</div>';
}

let _poBusy=false;
async function submitPayoutRequest(){
  if(_poBusy)return;
  const btn=document.getElementById('po-request');
  const raw=parseFloat(document.getElementById('po-amount').value);
  if(!(raw
=PAYOUT_MIN)){toast('Minimum payout is '+poMoney(PAYOUT_MIN));return;}
  _poBusy=true;btn.disabled=true;btn.style.opacity='.5';btn.textContent='Sending';
  try{
    const{data,error}=await sb.functions.invoke('request-payout',{body:{amount:Number(raw.toFixed(2))}});
    // invoke() surfaces a non-2xx as an opaque error, so read the function's own message.
    let msg=data&&data.error;
    if(error&&!msg){try{msg=(await error.context.json()).error;}catch(_){msg=error.message;}}
    if(msg)throw new Error(msg);
    document.getElementById('po-amount').value='';
    toast('Payout requested &#10003;');
    await loadPayouts();
  }catch(e){
    console.warn('payout request failed',e);
    toast(e.message||'Payout request failed');
  }finally{
    _poBusy=false;btn.disabled=false;btn.style.opacity='';btn.textContent='Request';
  }
}

function _boxBlur(id,r){
  const w=id.width,h=id.height,d=r*2+1,px=id.data,out=new Uint8ClampedArray(px.length);
  // Horizontal
  for(let y=0;y<h;y++){let rs=0,gs=0,bs=0,as=0;
    for(let i=-r;i<=r;i++){const j=(y*w+Math.min(Math.max(i,0),w-1))*4;rs+=px[j];gs+=px[j+1];bs+=px[j+2];as+=px[j+3];}
    for(let x=0;x<w;x++){const o=(y*w+x)*4;out[o]=rs/d|0;out[o+1]=gs/d|0;out[o+2]=bs/d|0;out[o+3]=as/d|0;
      const aj=(y*w+Math.min(x+r+1,w-1))*4,rj=(y*w+Math.max(x-r,0))*4;
      rs+=px[aj]-px[rj];gs+=px[aj+1]-px[rj+1];bs+=px[aj+2]-px[rj+2];as+=px[aj+3]-px[rj+3];}}
  // Vertical
  const fin=new Uint8ClampedArray(px.length);
  for(let x=0;x<w;x++){let rs=0,gs=0,bs=0,as=0;
    for(let i=-r;i<=r;i++){const j=(Math.min(Math.max(i,0),h-1)*w+x)*4;rs+=out[j];gs+=out[j+1];bs+=out[j+2];as+=out[j+3];}
    for(let y=0;y<h;y++){const o=(y*w+x)*4;fin[o]=rs/d|0;fin[o+1]=gs/d|0;fin[o+2]=bs/d|0;fin[o+3]=as/d|0;
      const aj=(Math.min(y+r+1,h-1)*w+x)*4,rj=(Math.max(y-r,0)*w+x)*4;
      rs+=out[aj]-out[rj];gs+=out[aj+1]-out[rj+1];bs+=out[aj+2]-out[rj+2];as+=out[aj+3]-out[rj+3];}}
  return new ImageData(fin,w,h);
}
async function generateOgPreview(src){
  try{
    const resp=await fetch(src);
    if(!resp.ok)return null;
    const bmp=await createImageBitmap(await resp.blob());
    const tw=900,th=1200;
    const sc=Math.max(tw/bmp.width,th/bmp.height);
    const sw=Math.round(bmp.width*sc),sh=Math.round(bmp.height*sc);
    const ox=(sw-tw)/2,oy=(sh-th)/2;
    // Draw cropped image at small size for fast blur
    const sm=document.createElement('canvas');sm.width=225;sm.height=300;
    const sx=sm.getContext('2d');
    sx.drawImage(bmp,-ox/tw*225,-oy/th*300,Math.round(bmp.width*sc/tw*225),Math.round(bmp.height*sc/th*300));
    bmp.close();
    // Box blur 3 passes on pixel data (matches server-side logic)
    let id=sx.getImageData(0,0,225,300);
    for(let p=0;p<3;p++)id=_boxBlur(id,24);
    // Draw blurred small image to final size (bilinear upscale)
    sx.putImageData(id,0,0);
    const c=document.createElement('canvas');c.width=tw;c.height=th;
    const cx2=c.getContext('2d');
    cx2.imageSmoothingEnabled=true;cx2.imageSmoothingQuality='high';
    cx2.drawImage(sm,0,0,tw,th);
>
    return await new Promise(r=>
c.toBlob(r,'image/png'));
  }catch(e){console.warn('generateOgPreview error:',e);return null;}
}

    function getDeviceId(){
      let deviceId=localStorage.getItem('clips_device_id');
      if(!deviceId){
        const fingerprint=[navigator.userAgent,navigator.language,screen.width+'x'+screen.height,new Date().getTimezoneOffset(),navigator.hardwareConcurrency||0,navigator.deviceMemory||0].join('|');
        let hash=0;

        }
        const random=Math.random().toString(36).substring(2,15);

        localStorage.setItem('clips_device_id',deviceId);
